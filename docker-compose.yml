# RASCUNHO — NÃO SUBIR sem ok do Rodrigo.
# PathPrefix /api no host dados.co-labore.com (prioridade > espelho nginx).
# Sem ports publicados; rede Traefik `proxy`. Sem pull sem aprovação.
name: observatorio-api

services:
  observatorio-api:
    build: .
    # image: a definir com digest após primeiro build aprovado
    container_name: observatorio-api
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    mem_limit: 512m
    cpus: "1.0"
    environment:
      ACERVO_ROOT: /data
      API_ROOT_PATH: /api
    volumes:
      - /home/rodrigo/acervo-publico:/data:ro
    networks: [proxy]
    labels:
      cliente: co-labore
      env: staging
      camada: dados
      traefik.enable: "true"
      traefik.docker.network: proxy
      traefik.http.routers.dados-api.entrypoints: websecure
      traefik.http.routers.dados-api.rule: Host(`dados.co-labore.com`) && PathPrefix(`/api`)
      traefik.http.routers.dados-api.priority: "100"
      traefik.http.routers.dados-api.tls: "true"
      traefik.http.routers.dados-api.tls.certresolver: letsencrypt
      traefik.http.routers.dados-api.middlewares: dados-api-ratelimit
      traefik.http.routers.dados-api.service: dados-api
      traefik.http.services.dados-api.loadbalancer.server.port: "8000"
      traefik.http.middlewares.dados-api-ratelimit.ratelimit.average: "30"
      traefik.http.middlewares.dados-api-ratelimit.ratelimit.burst: "60"
      traefik.http.middlewares.dados-api-ratelimit.ratelimit.sourcecriterion.requestheadername: CF-Connecting-IP

networks:
  proxy:
    external: true
